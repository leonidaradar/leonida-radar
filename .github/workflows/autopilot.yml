name: autopilot

# Her gün 06:00 UTC (Türkiye saatiyle 09:00) çalışır; content.csv değişince hemen çalışır; elle de başlatılabilir.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "content.csv"
      - "brand.json"
      - "autopilot_config.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow

      - name: Videoları üret (değişmeyenler önbellekten)
        env:
          MEDIA_CACHE_DIR: media
        run: python factory.py

      - name: Atlanan ve uyarılı satırları özete yaz
        run: |
          {
            echo "### Satır kontrolü"
            if [ -s out/skipped.txt ]; then
              echo '```'
              cat out/skipped.txt
              echo '```'
            else
              echo "Tüm satırlar geçerli."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Yayın öncesi kontrol (başarısızsa yayın yapılmaz)
        run: python check.py

      - name: Videoları media klasörüne kopyala ve kaydet
        run: |
          mkdir -p media
          find out -maxdepth 1 \( -name '*.mp4' -o -name '*.hash' -o -name '*_c*.png' \) -exec cp {} media/ \;
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -m "media: videolar güncellendi"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: media

      - name: Videoları herkese açık adrese yayınla (GitHub Pages)
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Buffer'a gönder
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          python publish.py | tee publish_log.txt
          {
            echo "### Buffer yayın özeti"
            echo '```'
            tail -n 25 publish_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Yayın durumunu kaydet
        run: |
          [ -f published.json ] && git add published.json || true
          git diff --cached --quiet || git commit -m "durum: yayınlananlar güncellendi"
          git push
